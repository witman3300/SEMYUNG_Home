<body>
  <div id="site-header"></div>

  <!-- 목록 -->
  <div id="blogList">
    <section class="page-hero">
      <div class="container">
        <p class="crumb"><a href="index.html">홈</a> · 블로그</p>
        <h1>세명장교 <em>인사이트</em></h1>
        <p>창업·사무실·AI·금융에 대한 실질적인 정보를 전합니다.</p>
      </div>
    </section>
    <section class="section">
      <div class="container">
        <div class="blog-grid" id="blogGrid">
          <div class="blog-loading">글을 불러오는 중입니다...</div>
        </div>
      </div>
    </section>
  </div>

  <!-- 상세 -->
  <div id="blogDetail" hidden>
    <section class="page-hero">
      <div class="container"><p class="crumb"><a href="index.html">홈</a> · <a href="blog.html">블로그</a></p></div>
    </section>
    <section class="section">
      <div class="container">
        <article class="post" id="postArticle"></article>
        <p style="text-align:center;margin-top:40px"><a href="blog.html" class="btn btn-outline">← 목록으로</a></p>
      </div>
    </section>
  </div>

  <div id="site-footer"></div>
  <script src="js/layout.js"></script>
  <script>
  (function () {
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    const listEl = document.getElementById('blogList');
    const detailEl = document.getElementById('blogDetail');
    const esc = (s) => (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmt = (d) => { try { return new Date(d).toLocaleDateString('ko-KR'); } catch { return ''; } };

    if (id) {
      listEl.hidden = true; detailEl.hidden = false;
      fetch('/api/blog/' + encodeURIComponent(id))
        .then(r => { if (!r.ok) throw 0; return r.json(); })
        .then(p => {
          document.title = p.title + ' | 세명장교 블로그';
          document.getElementById('postArticle').innerHTML =
            `<p class="post-cat">${esc(p.category || '소식')}</p>
             <h1>${esc(p.title)}</h1>
             <p class="post-date">${fmt(p.created_at)}</p>
             <div class="post-content">${esc(p.content)}</div>`;
        })
        .catch(() => { document.getElementById('postArticle').innerHTML = '<p style="text-align:center;color:var(--text-muted)">글을 찾을 수 없습니다.</p>'; });
    } else {
      const grid = document.getElementById('blogGrid');
      fetch('/api/blog')
        .then(r => { if (!r.ok) throw 0; return r.json(); })
        .then(posts => {
          if (!posts.length) { grid.innerHTML = '<div class="blog-empty">아직 등록된 글이 없습니다. 곧 새로운 소식으로 찾아뵙겠습니다. 😊</div>'; return; }
          grid.innerHTML = posts.map(p =>
            `<a class="blog-card" href="blog.html?id=${p.id}">
               <div class="blog-thumb">📝</div>
               <div class="blog-body">
                 <div class="blog-cat">${esc(p.category || '소식')}</div>
                 <h3>${esc(p.title)}</h3>
                 <p class="blog-excerpt">${esc(p.excerpt || (p.content || '').slice(0, 90))}</p>
                 <div class="blog-meta"><span>${fmt(p.created_at)}</span><span>자세히 →</span></div>
               </div></a>`).join('');
        })
        .catch(() => { grid.innerHTML = '<div class="blog-empty">블로그를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</div>'; });
    }
  })();
  </script>
